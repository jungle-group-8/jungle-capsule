{% extends "base.html" %}

{% block content %}


<div class="min-h-screen flex items-center justify-center">

    <div class="w-full max-w-md flex flex-col items-center gap-8 px-6">

        <!-- 로고 -->
        <div class="w-full flex justify-center">
            <img
                src="{{ url_for('static', filename='images/capsule_with_tree.png') }}"
                class="w-100"
                alt="정글 캡슐 로고"
            >
        </div>

        <!-- 회원가입 폼 -->
        <div class="w-full flex flex-col gap-5">
            <form method="POST" action="{{ url_for('auth.signup') }}" onsubmit="return validateSignup()" class="w-full flex flex-col gap-5">

                <div class="flex items-center gap-4">
                <label class="w-24 text-sm font-semibold text-gray-700">
                    이름
                </label>

                <input
                    type="text"
                    required
                    name="name"
                    class="flex-1 border border-gray-300 rounded-lg px-3 py-2
                           focus:outline-none focus:ring-2 focus:ring-[#BFDDB8]
                           bg-white
                           focus:border-transparent"
                >
            </div>

            <div class="flex items-center gap-4">
                <label class="w-24 text-sm font-semibold text-gray-700">
                    이메일
                </label>

                <input
                    type="text"
                    required
                    name="mailAddress"
                    class="flex-1 border border-gray-300 rounded-lg px-3 py-2
                           focus:outline-none focus:ring-2 focus:ring-[#BFDDB8]
                           bg-white
                           focus:border-transparent"
                >
            </div>

            <div class="flex items-center gap-6">
                <label class="w-24 text-sm font-semibold text-gray-700">
                    커리큘럼
                </label>

                <label class="flex items-center gap-2 cursor-pointer">
                    <input
                        required
                        type="radio"
                        name="curriculum"
                        value="1"
                        class="w-4 h-4 accent-[#BFDDB8]"
                    >
                    <span class="text-sm text-gray-700">SW-AI</span>
                </label>

                <label class="flex items-center gap-2 cursor-pointer">
                    <input
                        required
                        type="radio"
                        name="curriculum"
                        value="2"
                        class="w-4 h-4 accent-[#BFDDB8]"
                    >
                    <span class="text-sm text-gray-700">Game</span>
                </label>

                <label class="flex items-center gap-2 cursor-pointer">
                    <input
                        required
                        type="radio"
                        name="curriculum"
                        value="3"
                        class="w-4 h-4 accent-[#BFDDB8]"
                    >
                    <span class="text-sm text-gray-700">Game Tech</span>
                </label>
            </div>


            <div class="flex items-center gap-4">
                <label class="w-24 text-sm font-semibold text-gray-700">
                    기수
                </label>

                <input
                required
                    type="text"
                    name="class"
                    class="flex-1 border border-gray-300 bg-white rounded-lg px-3 py-2
                           focus:outline-none focus:ring-2 focus:ring-[#BFDDB8]
                           focus:border-transparent"
                >
            </div>

            <div class="border-t border-gray-400"></div>

            <div class="flex items-center gap-4">
                <label class="w-24 text-sm font-semibold text-gray-700">
                    ID
                </label>

                <input
                    type="text"
                    name="id"
                    id="signupId"
                    required
                    class="flex-1 border border-gray-300 bg-white rounded-lg px-3 py-2
                           focus:outline-none focus:ring-2 focus:ring-[#BFDDB8]
                           focus:border-transparent"
                >
                <button
                    type="button"
                    onclick="checkId(event)"
                    class="w-1/4 py-2.5
                        bg-[#BFDDB8] text-gray-800 font-semibold
                        border border-gray-200
                        rounded-xl shadow-sm
                        hover:bg-[#BFDDB8]
                        transition"
                >
                    중복 확인
                </button>
            </div>

            <div class="flex items-center gap-4">
                <label class="w-24 text-sm font-semibold text-gray-700">
                    비밀번호
                </label>

                <input
                    type="password"
                    required
                    id="pw"
                    name="pw"
                    class="flex-1 border border-gray-300 bg-white rounded-lg px-3 py-2
                           focus:outline-none focus:ring-2 focus:ring-[#BFDDB8]
                           focus:border-transparent"
                >
            </div>

            <div class="flex items-center gap-4">
                <label class="w-24 text-sm font-semibold text-gray-700">
                    비밀번호 확인
                </label>

                <input
                    type="password"
                    required
                    id="pwConfirm"
                    name="pwConfirm"
                    class="flex-1 border border-gray-300 bg-white rounded-lg px-3 py-2
                           focus:outline-none focus:ring-2 focus:ring-[#BFDDB8]
                           focus:border-transparent"
                >
            </div>
            <p id="pwMessage" class="text-sm"></p>

            <label class="w-full text-sm font-semibold text-gray-700">
                    <span class="font-semibold">정글 수강생 인증</span><br>
                    정글에서 쓰고있는 와이파이 비밀번호는 무엇인가요?
            </label>

            <div class="flex items-center">
                <input
                    type="text"
                    required
                    id="isJungler"
                    name="isJungler"
                    class="flex-1 border border-gray-300 bg-white rounded-lg px-3 py-2
                           focus:outline-none focus:ring-2 focus:ring-[#BFDDB8]
                           focus:border-transparent"
                >
            </div>

            <div class="flex gap-6">
                <button
                    type="button"

                    class=" w-1/2 py-2.5
                        bg-gray-200 text-gray-800 font-semibold
                        border border-gray-200
                        rounded-xl shadow-sm
                        hover:bg-gray-300
                        transition"
                    onclick="location.href=`{{ url_for('authpage.login') }}`"
                >
                    취소
                </button>
                <button
                    type="submit"
                    class="w-1/2 py-2.5
                        bg-white text-gray-800 font-semibold
                        border border-gray-200
                        rounded-xl shadow-sm
                        hover:bg-[#BFDDB8]
                        transition"
                >
                    회원가입
                </button>
            </div>
            
        </form>
        </div>
    </div>

</div>


<script>
    const pwInput = document.getElementById("pw");
    const pwConfirmInput = document.getElementById("pwConfirm");
    const pwMessage = document.getElementById("pwMessage");

    function checkPassword() {
        if (!pwConfirmInput.value) {
            pwMessage.textContent = "";
            return;
        }

        if (pwInput.value === pwConfirmInput.value) {
            pwMessage.textContent = "비밀번호가 일치합니다.";
            pwMessage.className = "text-sm text-green-600";
        } else {
            pwMessage.textContent = "비밀번호가 일치하지 않습니다.";
            pwMessage.className = "text-sm text-red-500";
        }
    }

    pwInput.addEventListener("input", checkPassword);
    pwConfirmInput.addEventListener("input", checkPassword);
</script>
<script>
function validateSignup() {
    const form = document.querySelector('form[action="{{ url_for("auth.signup") }}"]');
    const name = form.elements["name"].value.trim();
    const email = form.elements["mailAddress"].value.trim();
    const curriculum = form.querySelector(
        'input[name="curriculum"]:checked'
    );

    if (!name) {
        alert("이름을 입력해 주세요.");
        form.elements["name"].focus();
        return false;
    }

    if (!email) {
        alert("이메일을 입력해 주세요.");
        form.elements["mailAddress"].focus();
        return false;
    }

    if (!curriculum) {
        alert("커리큘럼을 선택해 주세요.");
        return false;
    }

    if (pwInput.value !== pwConfirmInput.value) {
        alert("비밀번호가 일치하지 않습니다.");
        pwConfirmInput.focus();
        return false;
    }

    return true;
}
</script>

<script>
async function checkId(event) {
    event.preventDefault();

    const id = document.getElementById("signupId").value.trim();

    if (!id) {
        alert("아이디를 입력해 주세요.");
        return;
    }

    const formData = new FormData();
    formData.append("id", id);

    try {
        const response = await fetch("{{ url_for('auth.idCheck') }}", {
            method: "POST",
            body: formData
        });
        const data = await response.json();

        if (data.result === "success") {
            alert("사용 가능한 아이디입니다.");
        } else {
            alert("이미 사용 중인 아이디입니다.");
        }
    } catch (error) {
        console.error(error);
        alert("중복 확인 중 오류가 발생했습니다.");
    }
}
</script>

{% endblock %}
