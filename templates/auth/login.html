{% extends "base.html" %}

{% block content %}

<div class="min-h-screen flex items-center justify-center">

    <div class="w-full max-w-md flex flex-col items-center gap-8 px-6">

        <!-- 로고 -->
        <div class="w-full flex justify-center">
            <img
                src="{{ url_for('static', filename='images/capsule_with_tree.png') }}"
                class="w-100"
                alt="정글 캡슐 로고"
            >
        </div>

        <!-- 로그인 폼 -->
        <div class="w-full flex flex-col gap-5">

            <div class="flex items-center gap-4">
                <label class="w-24 text-sm font-semibold text-gray-700">
                    ID
                </label>

                <input
                    type="text"
                    name="ID"
                    class="flex-1 border border-gray-300 bg-gray-100 rounded-lg px-3 py-2
                           focus:outline-none focus:ring-2 focus:ring-[#BFDDB8]
                           focus:border-transparent"
                >
            </div>

            <div class="flex items-center gap-4">
                <label class="w-24 text-sm font-semibold text-gray-700">
                    비밀번호
                </label>

                <input
                    type="password"
                    name="Password"
                    class="flex-1 border border-gray-300 bg-gray-100 rounded-lg px-3 py-2
                           focus:outline-none focus:ring-2 focus:ring-[#BFDDB8]
                           focus:border-transparent"
                >
            </div>

            <button
                type="submit"
                class="mt-2 w-full py-2.5
                       bg-white text-gray-800 font-semibold
                       border border-gray-200
                       rounded-xl shadow-sm
                       hover:bg-[#BFDDB8]
                       transition"
            >
                로그인
            </button>

            <div class="flex items-center justify-center gap-3 text-sm text-gray-600">
                <div 
                    onclick="location.href=`{{url_for('sign_up')}}`"
                    class="underline cursor-pointer"
                >
                    회원가입 
                </div>
                <span>|</span>
                <div 
                    class="underline cursor-pointer">
                    비밀번호 찾기
                </div>
            </div>
        </div>

    </div>

</div>

{% endblock %}
