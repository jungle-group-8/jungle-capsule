<!-- 뼈대가 되는 html  -->
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캡슐 보내기</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}"> </head>

    <script>
        function openModal() {
            const modal = document.getElementById('capsule-modal');

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('capsule-modal');

            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    </script>

<body>
    <!-- 헤더 -->
    {% include 'components/header.html' %}

    <!-- 화면 비율 상속 -->
    {% extends "base.html" %}
    {% block content %}

    <div class="grid grid-cols-5 gap-3 place-items-center py-3">
        <div class="flex flex-col bg-white shadow-2xl rounded-[20px]">
            <img src="{{ url_for('static', filename='images/closed_capsule.png') }}" alt="닫힌 캡슐"
                class="w-60 h-60 mx-auto mt-8 cursor-pointer" onclick="openModal()">
            <div class=" text-shadow-black pt-1 pb-1 w-[80%] mx-auto bg-[#BFDDB8] border-r-amber-50 rounded-lg text-lg text-center font-bold
                leading-4">D-30</div>
            <div class="py-2.5 text-shadow-black text-xs text-center
                leading-4">미리보기 멘트</div>
        </div>

        <div class="flex flex-col bg-white shadow-2xl rounded-[20px]">
            <img src="{{ url_for('static', filename='images/closed_capsule.png') }}" alt="닫힌 캡슐"
                class="w-60 h-60 mx-auto mt-8 cursor-pointer">
            <div class=" text-shadow-black pt-1 pb-1 w-[80%] mx-auto bg-[#BFDDB8] border-r-amber-50 rounded-lg text-lg text-center font-bold
                leading-4">D-30</div>
            <div class="py-2.5 text-shadow-black text-xs text-center
                leading-4">미리보기 멘트</div>
        </div>
    </div>


    <!-- 캡슐 상세 보기 팝업 박스 -->
    <div id="capsule-modal" class="hidden fixed inset-0 z-50 items-center justify-center bg-black/40 px-4 py-4">
        <div class="w-full max-w-md bg-[#BFDDB8] rounded-3xl shadow-2xl p-6">

            <div class="flex justify-between items-center"
                <h2 class="text-2xl font-bold text-black mb-1">00님으로부터 온 캡슐</h2>
                <p class="text-black text-left mb-1">
                    2026.08.24(월)
                </p>
            </div>

            <div class="border-t border-gray-400 mb-4"></div>

            <!-- 캡슐 상세 내용 -->
            <div class="w-full flex flex-col gap-4">

                <div class="flex items-center gap-4">
                    <label class="text-left text-sm font-semibold text-gray-700">
                        제목
                    </label>

                    <input type="text" readonly name="title" class="flex-1 border bg-white border-gray-300 rounded-md p-2
                           focus:outline-none focus:ring-2 focus:ring-[#BFDDB8]"> {{capslues.}}
                </div>

                <div class="flex items-center gap-4">
                    <label class="text-left text-sm font-semibold text-gray-700">
                        링크
                    </label>

                    <input type="text" readonly name="link" class="flex-1 border bg-white border-gray-300 rounded-md p-2
                           focus:outline-none focus:ring-2 focus:ring-[#BFDDB8]">
                </div>

                <div class="flex items-start gap-4">
                    <label class="text-right text-sm font-semibold text-gray-700 pt-2">
                        내용
                    </label>

                    <textarea name="content" readonly class="flex-1 min-h-32 border bg-white border-gray-300 rounded-md p-2
                           focus:outline-none focus:ring-2 focus:ring-[#BFDDB8]"></textarea>
                </div>

                <div class="bg-banner"></div>

                <div class="flex gap-3">
                    <button type="button" class=" w-full py-2.5
                            bg-white text-gray-800 font-semibold
                            border border-gray-200
                            rounded-xl shadow-sm
                            hover:bg-gray-200
                            transition" onclick="closeModal()">
                        닫기
                    </button>
                   
                </div>
            </div>
        </div>

        {% endblock %}

</body>

</html>
