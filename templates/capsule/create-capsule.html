<!-- 뼈대가 되는 html  -->
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캡슐 보내기</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}" </head>

    <script>
        function onChangeSelectFile(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const imagePreview = document.getElementById('image-preview');
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }
    </script>

<body>
    <!-- 헤더 -->
    {% include 'components/header.html' %}

    <!-- 화면 비율 상속 -->
    {% extends "base.html" %}

    {% block content %}

    <div class="flex px-8 py-8">

        <div class="w-full max-w-6xl flex items-center gap-6">

            <!-- 왼쪽 이미지 -->
            <div class="w-1/3 flex justify-center">
                <img src="{{ url_for('static', filename='images/capsule_root.png') }}" alt="정글 캡슐 로고"
                    class="w-full max-w-sm">
            </div>

            <!-- 오른쪽 폼 -->
            <div class="w-2/3 flex flex-col gap-4">

                <div class="flex items-center gap-4">
                    <label class="w-28 text-right text-sm font-semibold text-gray-700">
                        제목
                    </label>

                    <input type="text" name="title" class="flex-1 border bg-white border-gray-300 rounded-md p-2
                           focus:outline-none focus:ring-2 focus:ring-[#BFDDB8]">
                </div>

                <div class="flex items-center gap-4">
                    <label class="w-28 text-right text-sm font-semibold text-gray-700">
                        미리보기
                    </label>

                    <input type="text" name="preview" class="flex-1 border bg-white border-gray-300 rounded-md p-2
                           focus:outline-none focus:ring-2 focus:ring-[#BFDDB8]">
                </div>

                <div class="flex items-center gap-4">
                    <label class="w-28 text-right text-sm font-semibold text-gray-700">
                        링크
                    </label>

                    <input type="text" name="link" class="flex-1 border bg-white border-gray-300 rounded-md p-2
                           focus:outline-none focus:ring-2 focus:ring-[#BFDDB8]">
                </div>

                <div class="flex items-start gap-4">
                    <label class="w-28 text-right text-sm font-semibold text-gray-700 pt-2">
                        내용
                    </label>

                    <textarea name="content" placeholder="내용을 입력하세요" class="flex-1 min-h-32 border bg-white border-gray-300 rounded-md p-2
                           focus:outline-none focus:ring-2 focus:ring-[#BFDDB8]"></textarea>
                </div>

                <div class="flex items-center gap-4">
                    <label class="w-28 text-right text-sm font-semibold text-gray-700">
                        캡슐 개봉일
                    </label>

                    <input type="date" name="open_date" class="flex-1 border bg-white border-gray-300 rounded-md p-2
                           focus:outline-none focus:ring-2 focus:ring-[#BFDDB8]">
                </div>

                <div class="flex items-center gap-4">
                    <label class="w-28 text-right text-sm font-semibold text-gray-700">
                        이미지 업로드
                    </label>
                    <input type="file" name="image" accept="image/*" onchange="onChangeSelectFile(event)" class="flex-1 h-11
                   border border-gray-300
                   bg-white rounded-lg
                   text-sm text-gray-600
                   cursor-pointer
                   file:h-full
                   file:border-0
                   file:border-r
                   file:border-gray-200
                   file:bg-[#F3F8F1]
                   file:px-4
                   file:text-sm
                   file:font-semibold
                   file:text-gray-700
                   file:cursor-pointer
                   file:hover:bg-[#BFDDB8]
                   focus:outline-none
                   focus:ring-2 focus:ring-[#BFDDB8]">

                </div>

                <div class="flex justify-center mt-4">
                    <button class="w-1/3 px-4 py-2 bg-white text-black
                           rounded-[20px] shadow-md text-sm font-semibold
                           hover:bg-[#BFDDB8] transition">
                        캡슐 보내기
                    </button>
                </div>



            </div>

        </div>

        {% endblock %}

</body>

</html>
