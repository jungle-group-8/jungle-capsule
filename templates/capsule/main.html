<!-- 뼈대가 되는 html  -->
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홈화면</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
</head>

<script>
    function openModal() {
        const modal = document.getElementById('modal');

        modal.classList.remove('hidden');
        modal.classList.add('flex');
    }

    function closeModal() {
        const modal = document.getElementById('modal');

        modal.classList.add('hidden');
        modal.classList.remove('flex');
    }
</script>

<body>
    <!-- 헤더 -->
    {% include 'components/header.html' %}

    <!-- 화면 비율 상속 -->
    {% extends "base.html" %}
    {% block content %}

    <div class="flex gap-4">
        <div class="w-1/2 grid grid-cols-2 grid-rows-[25rem_25rem] gap-4">
            <button
                type="button"
                onclick="location.href=`{{ url_for('capsule.create_choice') }}`"
                class="flex flex-col items-start justify-between w-full h-full p-6
                    text-xl font-bold text-left
                    rounded-[20px] bg-white text-black shadow-md
                    hover:bg-[#BFDDB8] transition"
            >
                <span>캡슐 생성</span>
                <img src="{{url_for('static',filename='images/go.png')}}" class="mb-5 w-1/3" alt="바로가기 이미지">
                
            </button>


            <button
                type="button"
                onclick="openModal()"
                class="flex flex-col items-start justify-between w-full h-full p-6
                    text-xl font-bold text-left
                    rounded-[20px] bg-white text-black shadow-md
                    hover:bg-[#BFDDB8] transition"
            >
                오늘의 질문 생성
                <img src="{{url_for('static',filename='images/go.png')}}" class="mb-5 w-1/3" alt="바로가기 이미지">
            </button>

            <button
                type="button"
                onclick="location.href=`{{ url_for('capsule.capsule_storage') }}`"
                class="flex col-span-2 items-start justify-start w-full h-full pt-6 pl-6
                    text-xl font-bold text-left
                    rounded-[20px] bg-white text-black shadow-md
                    hover:bg-[#BFDDB8] transition"
            >
                나의 캡슐 보관함

            </button>
    </div>


        <div class="w-[40%] grid grid-cols-2 grid-rows-[25rem_12.5rem_12.5rem] gap-4">

            <!-- 오늘의 질문 -->
            <div class="col-span-2 flex flex-col h-full items-end px-4 py-2 wrap-break-word text-black">
                <h2 class="font-bold text-left text-xl">오늘의 질문 (2026.8.27(목))</h2>
                <p class="text-left">오늘의 질문을 참고하여 타임캡슐 내용을 작성해보세요.</p>
                <p class="text-left w-full text-xl pt-2 text-green-800">"{{qa}}"</p>

                <img src="{{url_for('static',filename='images/capsule_with_tree.png')}}" class="self-end mt-auto w-[40%]" alt="바로가기 이미지">
            </div>

            <!-- 대시보드  -->
            <button
                type="button"
                class="flex flex-col items-stretch justify-between w-full h-full p-6
                    bg-[#BFDDB8] text-black rounded-[20px] shadow-md">
                <span class="self-start font-bold text-left">오늘 열 수 있는 캡슐 개수</span>
                <span class="self-end text-4xl font-bold">{{ count_cap.get("OpenCapCount") }}</span>
            </button>
            <button
                type="button"
                class="flex flex-col items-stretch justify-between w-full h-full p-6
                    bg-[#BFDDB8] text-black rounded-[20px] shadow-md">
                <span class="self-start font-bold text-left">오늘 받은 캡슐 개수</span>
                <span class="self-end text-4xl font-bold">{{ count_cap.get("CreateCount") }}</span>
            </button>

            <button
                type="button"
                class="flex flex-col items-stretch justify-between w-full h-full p-6
                    bg-[#BFDDB8] text-black rounded-[20px] shadow-md">
                <span class="self-start font-bold text-left">오늘 작성한 캡슐 개수</span>
                <span class="self-end text-4xl font-bold">{{ count_cap.get("CloseCapCount") }}</span>
            </button>
        </div>
    </div>

    <!-- 팝업 박스 -->
    <div id="modal" class="hidden fixed inset-0 z-50 items-center  justify-center bg-black/40 px-4 py-4">
        <div class="w-full max-w-md bg-[#BFDDB8] rounded-3xl shadow-2xl p-6">
            <h2 class="text-2xl font-bold text-black">오늘의 질문 등록하기</h2>
            <p class="text-black text-left mb-1">
                모든 정글러가 함께 답할 질문을 작성해주세요.<br />
                정글에서의 생각과 순간을 기록할 수 있는 질문이면 더 좋아요.
            </p>

            <div class="border-t border-gray-400 mb-4"></div>

            <form action="{{ url_for('capquestion.making_QA') }}" method="POST">
                <textarea name="questionList" required placeholder="내용을 입력하세요" class="w-full mb-1 flex-1 min-h-32 border bg-white border-gray-300 rounded-md p-2
                    focus:outline-none focus:ring-2 focus:ring-[#BFDDB8]"></textarea>

                <div class="flex gap-3">
                    <button type="button" class=" w-1/2 py-2.5
                                bg-gray-200 text-gray-800 font-semibold
                                border border-gray-200
                                rounded-xl shadow-sm
                                hover:bg-gray-300
                                transition" onclick="closeModal()">
                        취소
                    </button>

                    <button type="submit" class="w-1/2 py-2.5
                                bg-white text-gray-800 font-semibold
                                border border-gray-200
                                rounded-xl shadow-sm
                                hover:bg-[#BFDDB8]
                                transition">
                        질문 보내기
                    </button>
                </div>
            </form>
        </div>
    </div>
    {% endblock %}
</body>


</html>
